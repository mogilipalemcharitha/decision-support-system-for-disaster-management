<!DOCTYPE html>
<html>
<head>
    <title>Disaster Management Expert System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
        }

        .header {
            background: #263238;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 70%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .dashboard {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #455a64;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Collaborative Decision Support System</h1>
    <p>Disaster Management Expert System</p>
</div>

<div class="container">

    <h2>Disaster Information</h2>

    <form action="/analyze" method="POST">

        <label>Disaster Type</label>

        <select name="disaster_type" required>
            <option value="Flood">Flood</option>
            <option value="Earthquake">Earthquake</option>
            <option value="Cyclone">Cyclone</option>
            <option value="Fire">Fire</option>
            <option value="Landslide">Landslide</option>
        </select>


        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="Enter affected location"
            required
        >


        <label>Number of People Affected</label>

        <input
            type="number"
            name="people_affected"
            min="0"
            required
        >


        <label>Medical Emergency</label>

        <select name="medical_emergency" required>
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
        </select>


        <label>Road Status</label>

        <select name="road_status" required>
            <option value="ACCESSIBLE">Accessible</option>
            <option value="BLOCKED">Blocked</option>
        </select>


        <label>Available Ambulances</label>

        <input
            type="number"
            name="ambulances"
            min="0"
            required
        >


        <label>Available Hospital Beds</label>

        <input
            type="number"
            name="hospital_beds"
            min="0"
            required
        >


        <button type="submit">
            Analyze Disaster
        </button>

    </form>

    <a class="dashboard" href="/dashboard">
        Open Collaboration Dashboard
    </a>

</div>

</body>
</html>
