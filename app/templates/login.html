{% extends "base.html" %}

{% block title %}Login - Emergency Decision Support System{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 40px auto;">
    <div class="card" style="text-align: center;">
        <h2 style="color: var(--primary); margin-bottom: 5px;">🚨 Emergency DSS Login</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">
            Role-Based Disaster Management Portal
        </p>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group" style="text-align: left;">
                <label>Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div class="form-group" style="text-align: left;">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                🔑 Secure Login
            </button>
        </form>

        <hr style="border-color: var(--border); margin: 25px 0;">

        <div style="text-align: left;">
            <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 10px;">
                ⚡ QUICK DEMO ACCOUNTS (Click to autofill):
            </p>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                <button type="button" class="btn btn-secondary" onclick="fillCreds('admin', 'admin123')" style="font-size: 0.75rem;">System Admin</button>
                <button type="button" class="btn btn-secondary" onclick="fillCreds('authority', 'auth123')" style="font-size: 0.75rem;">Disaster Authority</button>
                <button type="button" class="btn btn-secondary" onclick="fillCreds('police', 'police123')" style="font-size: 0.75rem;">Police</button>
                <button type="button" class="btn btn-secondary" onclick="fillCreds('fire', 'fire123')" style="font-size: 0.75rem;">Fire & Rescue</button>
                <button type="button" class="btn btn-secondary" onclick="fillCreds('medical', 'med123')" style="font-size: 0.75rem;">Medical Team</button>
                <button type="button" class="btn btn-secondary" onclick="fillCreds('hospital', 'hosp123')" style="font-size: 0.75rem;">Hospital</button>
                <button type="button" class="btn btn-secondary" onclick="fillCreds('ngo', 'ngo123')" style="font-size: 0.75rem;">NGO / Volunteer</button>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
